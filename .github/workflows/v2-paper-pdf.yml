name: V2 exact-source manuscript PDFs
on:
  push:
    branches: [research/temporal-vpr-v2]
    paths:
      - 'paper/revisions/*/main.tex'
      - 'experiments/paper_v2/ci_build.py'
      - '.github/workflows/v2-paper-pdf.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install compiler on disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-fonts-recommended texlive-publishers texlive-pictures cm-super-minimal poppler-utils
      - name: Compile exact sources and preserve diagnostics
        run: python3 experiments/paper_v2/ci_build.py
      - name: Preserve PDFs and receipts on V2 branch
        if: always()
        run: |
          git add paper/revisions
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'G5: preserve exact-source PDF compilation and diagnostics'
            git push origin HEAD:research/temporal-vpr-v2
          fi
